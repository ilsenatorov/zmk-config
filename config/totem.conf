CONFIG_ZMK_SLEEP=y

# Relay the peripheral (right) half's battery level to the central (left)
# half so the host sees both halves' battery over BLE, not just the central's.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Intel AX200/AX201 Bluetooth controllers (this host) fail the initial GATT
# read during BLE pairing when the peripheral negotiates 2M PHY, causing an
# immediate connect/disconnect loop (ATT 0x0E "unlikely error" on HID/DIS
# reads). Disabling 2M PHY is ZMK's documented fix for these chipsets.
CONFIG_BT_CTLR_PHY_2M=n
