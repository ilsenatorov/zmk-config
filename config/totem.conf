CONFIG_ZMK_SLEEP=y
# Deep sleep after 5 min idle (default 15 min); connected-idle draws far more
# than deep sleep, and any keypress wakes it (reconnect takes a few seconds).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Sample the battery every 5 min instead of every 60 s. Levels seen by the
# host, the LED widget and &bat_type can be up to 5 min stale.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# Split central battery proxying (CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_*)
# is deliberately NOT enabled: it makes the central expose a second GATT
# Battery Service (relaying the peripheral's level), which triggers a BlueZ
# bug ("More than one BATT service exists for this device" in
# profiles/battery/battery.c) that aborts GATT service discovery entirely,
# causing a fast pair/disconnect loop. Only the central's own battery is
# reported to the host. (..._BATTERY_LEVEL_FETCHING alone is safe and is on:
# the repo's Kconfig selects it for &bat_type, which types both levels.)

# Intel AX200/AX201 Bluetooth controllers (this host) fail the initial GATT
# read during BLE pairing when the peripheral negotiates 2M PHY, causing an
# immediate connect/disconnect loop (ATT 0x0E "unlikely error" on HID/DIS
# reads). Disabling 2M PHY is ZMK's documented fix for these chipsets.
CONFIG_BT_CTLR_PHY_2M=n

# Let a host re-pair over its own existing bond (e.g. after "remove device"
# on the PC). Without this the keyboard keeps its half of the bond and Zephyr
# rejects the new pairing with SMP "Authentication requirements" until the
# profile is cleared on the keyboard (&bt BT_CLR). ZMK only allows it when the
# host is the active profile's own host, or the active profile is empty.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# ...which would otherwise imply passkey entry on the keyboard when pairing.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_POINTING=y
