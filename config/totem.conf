CONFIG_ZMK_SLEEP=y

# Intel AX200/AX201 Bluetooth controllers (this host) fail the initial GATT
# read during BLE pairing when the peripheral negotiates 2M PHY, causing an
# immediate connect/disconnect loop (ATT 0x0E "unlikely error" on HID/DIS
# reads). Disabling 2M PHY is ZMK's documented fix for these chipsets.
CONFIG_BT_CTLR_PHY_2M=n
